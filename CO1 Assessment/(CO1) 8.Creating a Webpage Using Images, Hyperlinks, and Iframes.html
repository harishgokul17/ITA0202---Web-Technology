<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Images, Hyperlinks, and Iframes</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f7f9fc;
      margin: 20px;
      line-height: 1.6;
    }
    h1 {
      color: #1f4e79;
      text-align: center;
    }
    .section {
      margin-bottom: 25px;
      padding: 15px;
      background: white;
      border: 1px solid #d8e2ef;
      border-radius: 8px;
    }
    img {
      max-width: 100%;
      height: auto;
      border: 2px solid #1f4e79;
      border-radius: 6px;
    }
    iframe {
      width: 100%;
      height: 300px;
      border: 2px solid #1f4e79;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <h1>Webpage with Images, Hyperlinks, and Iframes</h1>

  <div class="section">
    <h2>Image Example</h2>
    <p>Here is a sample image:</p>
    <img src="https://via.placeholder.com/400x200.png?text=Sample+Image" alt="Sample Image" />
  </div>

  <div class="section">
    <h2>Hyperlink Example</h2>
    <p>Visit <a href="https://www.w3schools.com" target="_blank">W3Schools</a> for more HTML tutorials.</p>
  </div>

  <div class="section">
    <h2>Iframe Example</h2>
    <p>This iframe displays a webpage inside the current page:</p>
    <iframe src="https://www.wikipedia.org/" title="Wikipedia"></iframe>
  </div>
</body>
</html>

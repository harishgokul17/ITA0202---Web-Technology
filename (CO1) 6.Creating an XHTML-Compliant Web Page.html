<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
  "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
<head>
  <title>XHTML-Compliant Web Page</title>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <style type="text/css">
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f7fa;
      color: #222;
      margin: 20px;
    }
    h1 {
      color: #0b5fa5;
      text-align: center;
    }
    p {
      line-height: 1.6;
    }
    .box {
      border: 2px solid #0b5fa5;
      padding: 15px;
      background-color: #ffffff;
      width: 70%;
      margin: 20px auto;
    }
  </style>
</head>
<body>
  <h1>Welcome to XHTML</h1>
  <div class="box">
    <p>This page is written in XHTML 1.0 Strict and follows strict markup rules.</p>
    <p>All tags are properly closed, attribute values are enclosed in quotes, and the document is well-formed.</p>
  </div>
</body>
</html>

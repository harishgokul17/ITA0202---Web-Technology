<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --page: #F4F6F2;
    --card: #FFFFFF;
    --ink: #223229;
    --ink-soft: #5B6B60;
    --sage: #4F7A5B;
    --sage-light: #E4EEE3;
    --border: #DCE3D9;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    padding: 48px 20px;
    background: var(--page);
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    display:flex;
    justify-content:center;
  }

  .card{
    width:100%;
    max-width: 480px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 28px 32px;
    box-shadow: 0 1px 3px rgba(34,50,41,0.06);
  }

  .header{
    display:flex;
    align-items:center;
    gap: 14px;
    padding-bottom: 18px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }

  .avatar{
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--sage-light);
    color: var(--sage);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Poppins', sans-serif;
    font-weight: 600;
    font-size: 18px;
    overflow:hidden;
    flex-shrink:0;
  }

  .avatar img{ width:100%; height:100%; object-fit:cover; }

  .header h1{
    font-family:'Poppins', sans-serif;
    font-size: 18px;
    font-weight: 600;
    margin:0;
  }

  .header p{
    font-size: 13px;
    color: var(--ink-soft);
    margin: 2px 0 0;
  }

  .field{
    margin-bottom: 16px;
  }

  .field label{
    font-size: 13px;
    color: var(--ink-soft);
    display:flex;
    align-items:center;
    gap: 6px;
    margin-bottom: 6px;
  }

  input[type="text"],
  input[type="email"],
  input[type="date"],
  select,
  textarea,
  input[type="file"]{
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #FBFCFA;
    color: var(--ink);
  }

  input:focus, select:focus, textarea:focus{
    outline:none;
    border-color: var(--sage);
    box-shadow: 0 0 0 3px var(--sage-light);
  }

  textarea{ resize: vertical; }

  .gender-row{
    display:flex;
    gap: 18px;
  }

  .gender-row label{
    display:flex;
    align-items:center;
    gap: 6px;
    font-size: 14px;
    color: var(--ink);
  }

  input[type="radio"], input[type="checkbox"]{
    accent-color: var(--sage);
    width: 15px;
    height: 15px;
  }

  .course-tag{
    font-size: 12px;
    color: var(--sage);
    margin: 6px 0 0;
    min-height: 14px;
  }

  .declaration{
    display:flex;
    align-items:flex-start;
    gap: 8px;
    font-size: 13px;
    color: var(--ink-soft);
    padding-top: 12px;
    border-top: 1px solid var(--border);
    margin-bottom: 18px;
  }

  .declaration input{ margin-top: 2px; }

  .actions{
    display:flex;
    gap: 10px;
  }

  button{
    flex:1;
    font-family:'Poppins', sans-serif;
    font-weight: 500;
    font-size: 14px;
    padding: 11px 0;
    border-radius: 8px;
    border: 1px solid var(--border);
    cursor: pointer;
    background: var(--card);
    color: var(--ink);
    transition: background 0.15s ease;
  }

  button[type="submit"]{
    background: var(--sage);
    border-color: var(--sage);
    color: #fff;
  }

  button[type="submit"]:hover{ background: #436A4F; }
  button[type="reset"]:hover{ background: var(--sage-light); }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <div class="avatar" id="avatar">+</div>
    <div>
      <h1>Student registration</h1>
      <p>Academic year 2026-27</p>
    </div>
  </div>

  <form action="#" method="post" id="regForm">
    <div class="field">
      <label for="studentName">Student name</label>
      <input type="text" id="studentName" name="studentName" placeholder="Enter your full name" required>
    </div>

    <div class="field">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>
    </div>

    <div class="field">
      <label for="dob">Date of birth</label>
      <input type="date" id="dob" name="dob">
    </div>

    <div class="field">
      <label>Gender</label>
      <div class="gender-row">
        <label><input type="radio" id="male" name="gender" value="Male"> Male</label>
        <label><input type="radio" id="female" name="gender" value="Female"> Female</label>
      </div>
    </div>

    <div class="field">
      <label for="course">Course</label>
      <select id="course" name="course">
        <option value="">Select a course</option>
        <option value="CSE">Computer Science Engineering</option>
        <option value="ECE">Electronics and Communication Engineering</option>
        <option value="EEE">Electrical and Electronics Engineering</option>
        <option value="MECH">Mechanical Engineering</option>
      </select>
      <p class="course-tag" id="courseTag"></p>
    </div>

    <div class="field">
      <label for="address">Address</label>
      <textarea id="address" name="address" rows="3" placeholder="Enter your address"></textarea>
    </div>

    <div class="field">
      <label for="photo">Photograph</label>
      <input type="file" id="photo" name="photo" accept="image/*">
    </div>

    <label class="declaration">
      <input type="checkbox" id="declaration" name="declaration" required>
      I confirm that the above information is correct.
    </label>

    <div class="actions">
      <button type="submit">Register</button>
      <button type="reset">Clear</button>
    </div>
  </form>
</div>

<script>
  const courseSelect = document.getElementById('course');
  const courseTag = document.getElementById('courseTag');
  courseSelect.addEventListener('change', () => {
    courseTag.textContent = courseSelect.value ? 'Selected: ' + courseSelect.options[courseSelect.selectedIndex].text : '';
  });

  const photoInput = document.getElementById('photo');
  const avatar = document.getElementById('avatar');
  photoInput.addEventListener('change', () => {
    if (photoInput.files && photoInput.files[0]) {
      const reader = new FileReader();
      reader.onload = (e) => {
        avatar.innerHTML = '<img src="' + e.target.result + '" alt="Uploaded photo">';
      };
      reader.readAsDataURL(photoInput.files[0]);
    }
  });

  document.getElementById('regForm').addEventListener('reset', () => {
    setTimeout(() => {
      courseTag.textContent = '';
      avatar.innerHTML = '+';
    }, 0);
  });
</script>

</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Creating an XML Document for Student Data</title>
    <style>
      body { font-family: Arial, Helvetica, sans-serif; line-height: 1.4; padding: 20px; }
      pre { background:#f6f8fa; padding:12px; border-radius:6px; overflow:auto }
      table { border-collapse: collapse; width:100%; margin-top:12px }
      th, td { border:1px solid #ddd; padding:8px; text-align:left }
      th { background:#f0f0f0 }
      .controls { margin-bottom:10px }
    </style>
  </head>
  <body>
    <h1>Creating an XML Document for Student Data</h1>
    <p>This page includes an example XML document, shows the raw XML, and parses it into a table using JavaScript.</p>

    <div class="controls">
      <button id="downloadXml">Download XML</button>
      <button id="toggleRaw">Toggle Raw XML</button>
    </div>

    <h2>Raw XML</h2>
    <pre id="rawXml" style="display:block"></pre>

    <h2>Parsed Students</h2>
    <table id="studentsTable">
      <thead>
        <tr><th>ID</th><th>Name</th><th>Department</th><th>Year</th><th>Email</th></tr>
      </thead>
      <tbody></tbody>
    </table>

    <script>
      // XML string for student data
      const xmlString = `<?xml version="1.0" encoding="UTF-8"?>
<students>
  <student id="101">
    <name>Alice Johnson</name>
    <department>Computer Science</department>
    <year>2</year>
    <email>alice@example.com</email>
  </student>

  <student id="102">
    <name>Bob Williams</name>
    <department>Information Technology</department>
    <year>3</year>
    <email>bob@example.com</email>
  </student>

  <student id="103">
    <name>Clara Davis</name>
    <department>Electronics</department>
    <year>1</year>
    <email>clara@example.com</email>
  </student>
</students>`;

      // Display raw XML safely
      document.getElementById('rawXml').textContent = xmlString;

      // Parse XML and populate table
      function populateTable(xml) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(xml, 'application/xml');
        const parseError = doc.getElementsByTagName('parsererror');
        const tbody = document.querySelector('#studentsTable tbody');
        tbody.innerHTML = '';
        if (parseError.length) {
          const tr = document.createElement('tr');
          const td = document.createElement('td');
          td.colSpan = 5;
          td.textContent = 'Error parsing XML: ' + parseError[0].textContent;
          tr.appendChild(td);
          tbody.appendChild(tr);
          return;
        }

        const students = doc.getElementsByTagName('student');
        for (let i = 0; i < students.length; i++) {
          const s = students[i];
          const id = s.getAttribute('id') || '';
          const name = s.getElementsByTagName('name')[0]?.textContent || '';
          const dept = s.getElementsByTagName('department')[0]?.textContent || '';
          const year = s.getElementsByTagName('year')[0]?.textContent || '';
          const email = s.getElementsByTagName('email')[0]?.textContent || '';

          const tr = document.createElement('tr');
          [id, name, dept, year, email].forEach(text => {
            const td = document.createElement('td');
            td.textContent = text;
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        }
      }

      populateTable(xmlString);

      // Download XML as a file
      document.getElementById('downloadXml').addEventListener('click', () => {
        const blob = new Blob([xmlString], { type: 'application/xml' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'students.xml';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      });

      // Toggle raw XML visibility
      document.getElementById('toggleRaw').addEventListener('click', () => {
        const el = document.getElementById('rawXml');
        el.style.display = (el.style.display === 'none') ? 'block' : 'none';
      });
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Scientific Calculator</title>
  <style>
    :root {
      --background: #eef2ff;
      --panel: #ffffff;
      --border: #c7d2fe;
      --text: #111827;
      --accent: #4338ca;
      --accent-soft: #e0e7ff;
      --shadow: 0 22px 62px rgba(15, 23, 42, 0.12);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #f8fbff 0%, #eef2ff 100%);
      color: var(--text);
      padding: 24px;
    }

    .calculator {
      width: min(420px, 100%);
      padding: 28px;
      border-radius: var(--radius);
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .calculator__header {
      margin: 0 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .calculator__header h1 {
      margin: 0;
      font-size: 1.35rem;
    }

    .display {
      width: 100%;
      min-height: 80px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }

    .display__expression {
      margin: 0;
      color: var(--text);
      font-size: 1rem;
      opacity: 0.75;
      word-break: break-all;
    }

    .display__result {
      margin: 0;
      font-size: 2rem;
      font-weight: 700;
      text-align: right;
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-top: 22px;
    }

    button {
      border: none;
      border-radius: 16px;
      padding: 18px 0;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.15s ease;
      background: var(--accent-soft);
      color: var(--text);
    }

    button:hover {
      transform: translateY(-1px);
    }

    .button--operator {
      background: #4338ca;
      color: white;
    }

    .button--wide {
      grid-column: span 2;
    }

    .button--danger {
      background: #ef4444;
      color: white;
    }

    .button--secondary {
      background: #c7d2fe;
    }

    @media (max-width: 420px) {
      .button-grid {
        gap: 10px;
      }

      button {
        padding: 16px 0;
      }
    }
  </style>
</head>
<body>
  <main class="calculator">
    <header class="calculator__header">
      <h1>Scientific Calculator</h1>
      <span>Click to calculate</span>
    </header>

    <section class="display">
      <p class="display__expression" id="expression">0</p>
      <p class="display__result" id="result">0</p>
    </section>

    <div class="button-grid">
      <button type="button" class="button--secondary" data-action="clear">C</button>
      <button type="button" class="button--secondary" data-action="parenthesis">( )</button>
      <button type="button" class="button--secondary" data-action="sqrt">√</button>
      <button type="button" class="button--operator" data-value="/">÷</button>

      <button type="button" data-value="7">7</button>
      <button type="button" data-value="8">8</button>
      <button type="button" data-value="9">9</button>
      <button type="button" class="button--operator" data-value="*">×</button>

      <button type="button" data-value="4">4</button>
      <button type="button" data-value="5">5</button>
      <button type="button" data-value="6">6</button>
      <button type="button" class="button--operator" data-value="-">−</button>

      <button type="button" data-value="1">1</button>
      <button type="button" data-value="2">2</button>
      <button type="button" data-value="3">3</button>
      <button type="button" class="button--operator" data-value="+">+</button>

      <button type="button" data-value="0">0</button>
      <button type="button" data-value=".">.</button>
      <button type="button" data-action="power">x²</button>
      <button type="button" class="button--danger" data-action="equals">=</button>

      <button type="button" class="button--wide button--operator" data-action="sin">sin</button>
      <button type="button" class="button--wide button--operator" data-action="cos">cos</button>
      <button type="button" class="button--wide button--operator" data-action="tan">tan</button>
    </div>
  </main>

  <script>
    const expressionEl = document.getElementById('expression');
    const resultEl = document.getElementById('result');
    const buttons = document.querySelectorAll('button');

    let expression = '';
    let activeParenthesis = false;

    function updateDisplay() {
      expressionEl.textContent = expression || '0';
      try {
        const sanitized = expression.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
        const computed = sanitized ? eval(sanitized) : 0;
        resultEl.textContent = Number.isFinite(computed) ? computed : 'Error';
      } catch {
        resultEl.textContent = 'Error';
      }
    }

    function calculateScientific(action) {
      try {
        const value = expression ? eval(expression.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-')) : 0;
        let output;

        if (action === 'sqrt') {
          output = Math.sqrt(value);
        } else if (action === 'power') {
          output = Math.pow(value, 2);
        } else if (action === 'sin') {
          output = Math.sin(value);
        } else if (action === 'cos') {
          output = Math.cos(value);
        } else if (action === 'tan') {
          output = Math.tan(value);
        }

        expression = String(output);
        updateDisplay();
      } catch {
        resultEl.textContent = 'Error';
      }
    }

    buttons.forEach(button => {
      button.addEventListener('click', () => {
        const value = button.dataset.value;
        const action = button.dataset.action;

        if (action === 'clear') {
          expression = '';
          resultEl.textContent = '0';
        } else if (action === 'equals') {
          try {
            expression = String(eval(expression.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-')));
          } catch {
            expression = '';
            resultEl.textContent = 'Error';
          }
        } else if (action === 'parenthesis') {
          expression += activeParenthesis ? ')' : '(';
          activeParenthesis = !activeParenthesis;
        } else if (action === 'sqrt' || action === 'power' || action === 'sin' || action === 'cos' || action === 'tan') {
          calculateScientific(action);
        } else if (value) {
          expression += value;
        }

        updateDisplay();
      });
    });
  </script>
</body>
</html>
